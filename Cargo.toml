[package]
authors = ["Pedro Neto <pedromneto97@gmail.com>"]
edition = "2021"
name = "webp_converter"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
image = "0.25.10"
libwebp-sys = "0.14.4"
napi-derive = "3.6.5"

[dependencies.napi]
version = "3.12.4"
features = ["napi10"]

[build-dependencies]
napi-build = "2.4.2"

[profile.release]
lto = true
strip = "symbols"
