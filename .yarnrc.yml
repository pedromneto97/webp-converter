# Dependency install scripts do not run. Packages in this repo ship prebuilt binaries through optionalDependencies.
enableScripts: false

nodeLinker: node-modules

npmAuditRegistry: "https://registry.npmjs.org"

# New package versions must be at least 3 days old before Yarn installs them.
npmMinimalAgeGate: 3d

# This package's own platform binaries are published moments before the release PR references them.
npmPreapprovedPackages:
  - "rust-webp-converter-*"

yarnPath: .yarn/releases/yarn-4.18.1.cjs
