name: Release
'on':
  push:
    branches:
      - main
    tags-ignore:
      - '**'
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  ci:
    name: CI
    uses: ./.github/workflows/CI.yml
  release-please:
    name: Release Please
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Optional PAT so CI runs on the release PR. PRs opened with GITHUB_TOKEN do not trigger workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
  publish:
    name: Publish
    needs:
      - ci
      - release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing (OIDC) and provenance. No long-lived npm token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: yarn install --immutable
      - name: Create npm dirs
        run: yarn napi create-npm-dirs
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Move artifacts
        run: yarn artifacts
      - name: List packages
        run: ls -R ./npm
        shell: bash
      - name: Publish
        # prepublishOnly runs `napi prepublish`, which publishes the per-platform packages first.
        # Trusted publishing needs npm >= 11.5.1 (bundled with Node 24).
        run: npm publish --access public --provenance
